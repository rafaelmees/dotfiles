# Dotfiles color palette + tmux status styles.
#
# The block between the markers below is regenerated by install when you
# pass color flags (e.g. ./install --primary 111). Change the defaults in
# install, not here — manual edits inside the markers get overwritten.
#
# >>> dotfiles palette (managed by install) >>>
set -g @primary       "colour250"
set -g @on_primary    "colour239"
set -g @secondary     "colour240"
set -g @on_secondary  "colour252"
set -g @surface       "colour237"
set -g @on_surface    "colour250"
set -g @background    "colour235"
set -g @on_background  "colour250"

set -g status-style             "bg=colour235,fg=colour250"
set -g pane-border-style        "fg=colour236"
set -g pane-active-border-style "fg=colour250"
set -g message-style            "bg=colour235,fg=white"
# <<< dotfiles palette <<<
