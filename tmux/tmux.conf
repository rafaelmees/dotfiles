# More comfortable prefix
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Theme palette + status styles (see tmux/theme.conf, generated by install)
source-file ~/.config/tmux/theme.conf
set -g status-interval 1

# Bottom bar
# Session name: secondary segment capped by a right arrow
set -g status-left "#[fg=#{@on_secondary},bg=#{@secondary},bold] #S #[fg=#{@secondary},bg=#{@background},nobold] "
# Clock: left arrow opening a secondary segment
set -g status-right "#[fg=#{@surface},bg=#{@background}]#[fg=#{@on_surface},bg=#{@surface}] %H:%M:%S "

# Inactive tabs: surface pill with arrows
set -g window-status-format "#[fg=#{@background},bg=#{@surface}]#[fg=#{@on_surface},bg=#{@surface}] #I:#W #[fg=#{@surface},bg=#{@background},nobold]"
# Current tab: primary pill with dark text, flanked by arrows
set -g window-status-current-format "#[fg=#{@background},bg=#{@primary}]#[fg=#{@on_primary},bg=#{@primary},bold] #I:#W #[fg=#{@primary},bg=#{@background},nobold]"

# Nicer appearance
set -g mouse on
set -g history-limit 100000

set -g default-terminal "tmux-256color"
# Truecolor (so lackluster/ghostty render the right colors inside tmux)
set -ag terminal-overrides ",*256col*:RGB"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Lower latency when pressing Esc (important in vim/neovim)
set -sg escape-time 10

# Forward extended keys (e.g. Ctrl+Tab) to apps like Neovim
set -g extended-keys on

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

bind C-h split-window -hbc "#{pane_current_path}"
bind C-j split-window -vc "#{pane_current_path}"
bind C-k split-window -vbc "#{pane_current_path}"
bind C-l split-window -hc "#{pane_current_path}"

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind-key -n 'C-\' if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
# Clipboard yank: pbcopy on macOS, wl-copy/xclip on Linux.
if-shell 'test "$(uname)" = Darwin' \
  "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'" \
  "bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy 2>/dev/null || xclip -selection clipboard -i'"
