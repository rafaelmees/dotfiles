add_newline = false
palette = "dotfiles"

format = """
$directory\
${custom.dircap}\
$git_branch\
$git_status\
$character\
"""

right_format = """
[](fg:surface)\
$cmd_duration\
$status\
$time
"""

[directory]
style = "bg:surface fg:strong"
format = "[ $path]($style)"
truncate_to_repo = false
truncation_length = 6
truncation_symbol = "…/"
read_only = " "
read_only_style = "bg:surface fg:on_surface"

[custom.dircap]
when = "! git rev-parse --is-inside-work-tree 2>/dev/null"
command = "true"
format = "[](fg:surface)"

[git_branch]
symbol = " "
style = "bg:primary fg:on_primary"
format = "[](fg:surface bg:primary)[ $symbol$branch]($style)"

[git_status]
style = "bg:primary fg:on_primary"
format = "[ $all_status$ahead_behind]($style)[](fg:primary)"
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = "?"
stashed = "≡"
modified = "±"
staged = "+"
renamed = "»"
deleted = "✘"

[cmd_duration]
min_time = 500
show_milliseconds = false
style = "bg:surface fg:dim"
format = "[ $duration]($style)"

[status]
disabled = false
style = "bg:surface fg:error"
format = "[ ✘ $status]($style)"

[time]
disabled = false
time_format = "%H:%M:%S"
style = "bg:surface fg:on_surface"
format = "[ $time ]($style)"

[character]
success_symbol = "[](primary)"
error_symbol = "[](primary)"
vimcmd_symbol = "[](primary)"

# >>> dotfiles palette (managed by install) >>>
[palettes.dotfiles]
primary = "250"
on_primary = "239"
secondary = "240"
on_secondary = "252"
surface = "237"
on_surface = "250"
background = "235"
on_background = "250"
error = "210"
dim = "245"
strong = "255"
# <<< dotfiles palette <<<
